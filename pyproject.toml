[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cagent"
version = "0.4.0"
description = "Dependency-free, class-based agent loop with sync-or-async host storage, tool approval, cooperative interruption and turn-end compression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
examples = ["python-dotenv>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cagent = ["py.typed"]
